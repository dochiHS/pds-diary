<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="계획(Plan) → 실제로 한 일(Do) → 돌아보기(See)가 하나로 이어지는 다이어리">
  <title>플랜두씨 다이어리</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="notice" id="public-notice" role="note">
    <strong class="notice-label">공개 안내</strong>
    <span id="public-notice-text">지금은 로그인이 없어 링크를 아는 사람은 누구나 볼 수 있습니다. 남이 봐도 괜찮은 내용만 넣으세요.</span>
    <span class="notice-sub">잠그는 일(로그인)은 다음 과제에서 붙입니다.</span>
  </div>

  <header class="top">
    <div class="brand">
      <h1>플랜두씨 다이어리</h1>
      <p class="tagline">계획(Plan) → 실제로 한 일(Do) → 돌아보기(See)</p>
    </div>
    <div class="top-actions">
      <label class="plan-picker">
        <span>계획</span>
        <select id="plan-select" aria-label="볼 계획 고르기" disabled>
          <option>불러오는 중…</option>
        </select>
      </label>
      <button type="button" id="btn-new-plan" class="btn">새 계획</button>
      <button type="button" id="btn-export" class="btn">내 자료 전체 내보내기 (JSON)</button>
    </div>
  </header>

  <nav class="steps" aria-label="단계">
    <a href="#sec-plan" data-jump="sec-plan"><b>1</b> 계획</a>
    <a href="#sec-tasks" data-jump="sec-tasks"><b>2</b> 할 일</a>
    <a href="#sec-logs" data-jump="sec-logs"><b>3</b> 실행 기록</a>
    <a href="#sec-review" data-jump="sec-review"><b>4</b> 돌아보기</a>
  </nav>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <main id="app">
    <p class="loading-note">불러오는 중…</p>
    <noscript><p class="error-box">이 앱은 자바스크립트가 켜져 있어야 동작합니다.</p></noscript>
  </main>

  <footer class="foot">
    <p>저장 위치: 서버 데이터베이스(Supabase) · 날짜와 시각은 모두 <b>서울 시간(KST, UTC+9)</b>으로 보여 줍니다 · 시간 단위: <b>분</b></p>
    <p>
      <a href="contracts/pds-schema-v2.json">DB 구조 문서 (pds-schema-v2.json)</a>
      · <a id="source-link" href="https://github.com/dochiHS/pds-diary" rel="noopener">소스</a>
    </p>
  </footer>
</body>
</html>
